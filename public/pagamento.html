<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Pagamento · Tech & Code Summit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>

<body data-page="pagamento">
    <main id="main">
        <div class="page-head">
            <div class="wrap">
                <h1 style="font-size:clamp(2rem,5vw,3.5rem)">Pagamento (simulado)</h1>
                <p>Nenhuma cobrança real é feita. Escolha um método para confirmar sua inscrição.</p>
            </div>
        </div>
        <section class="sec">
            <div class="wrap">
                <div id="resumo"></div>
                <form id="form-pag"><label>Método de pagamento<select name="metodo">
                            <option value="pix">Pix</option>
                            <option value="cartao">Cartão de crédito</option>
                            <option value="boleto">Boleto</option>
                        </select></label><button class="btn" type="submit">Confirmar pagamento</button></form>
            </div>
        </section>
    </main>
</body>

</html>
